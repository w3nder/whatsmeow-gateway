name: docker-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OCIR_REGISTRY: gru.ocir.io/axdwcdcrq2iy

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    env:
      OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.OCIR_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: gru.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/whatsmeow-gateway
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - id: ocir
        if: env.OCIR_USERNAME != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.OCIR_REGISTRY }}/clickmassax-gateway
          tags: |
            type=raw,value=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.ocir.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
